name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 1.7: Python 3.4
          - python-version: "3.4"
            django-version: "Django>=1.7,<1.8"

          # Django 1.8: Python 3.4, 3.5
          - python-version: "3.4"
            django-version: "Django>=1.8,<1.9"
          - python-version: "3.5"
            django-version: "Django>=1.8,<1.9"

          # Django 1.9: Python 3.4, 3.5
          - python-version: "3.4"
            django-version: "Django>=1.9,<1.10"
          - python-version: "3.5"
            django-version: "Django>=1.9,<1.10"

          # Django 1.10: Python 3.4, 3.5
          - python-version: "3.4"
            django-version: "Django>=1.10,<1.11"
          - python-version: "3.5"
            django-version: "Django>=1.10,<1.11"

          # Django 1.11: Python 3.4, 3.5, 3.6
          - python-version: "3.4"
            django-version: "Django>=1.11,<2.0"
          - python-version: "3.5"
            django-version: "Django>=1.11,<2.0"
          - python-version: "3.6"
            django-version: "Django>=1.11,<2.0"

          # Django 2.0: Python 3.4, 3.5, 3.6, 3.7
          - python-version: "3.4"
            django-version: "Django>=2.0,<2.1"
          - python-version: "3.5"
            django-version: "Django>=2.0,<2.1"
          - python-version: "3.6"
            django-version: "Django>=2.0,<2.1"
          - python-version: "3.7"
            django-version: "Django>=2.0,<2.1"

          # Django 2.1: Python 3.5, 3.6, 3.7
          - python-version: "3.5"
            django-version: "Django>=2.1,<2.2"
          - python-version: "3.6"
            django-version: "Django>=2.1,<2.2"
          - python-version: "3.7"
            django-version: "Django>=2.1,<2.2"

          # Django 2.2: Python 3.5, 3.6, 3.7, 3.8
          - python-version: "3.5"
            django-version: "Django>=2.2,<3.0"
          - python-version: "3.6"
            django-version: "Django>=2.2,<3.0"
          - python-version: "3.7"
            django-version: "Django>=2.2,<3.0"
          - python-version: "3.8"
            django-version: "Django>=2.2,<3.0"

          # Django 3.0: Python 3.6, 3.7, 3.8
          - python-version: "3.6"
            django-version: "Django>=3.0,<3.1"
          - python-version: "3.7"
            django-version: "Django>=3.0,<3.1"
          - python-version: "3.8"
            django-version: "Django>=3.0,<3.1"

          # Django 3.1: Python 3.6, 3.7, 3.8, 3.9
          - python-version: "3.6"
            django-version: "Django>=3.1,<3.2"
          - python-version: "3.7"
            django-version: "Django>=3.1,<3.2"
          - python-version: "3.8"
            django-version: "Django>=3.1,<3.2"
          - python-version: "3.9"
            django-version: "Django>=3.1,<3.2"

          # Django 3.2: Python 3.6, 3.7, 3.8, 3.9, 3.10
          - python-version: "3.6"
            django-version: "Django>=3.2,<4.0"
          - python-version: "3.7"
            django-version: "Django>=3.2,<4.0"
          - python-version: "3.8"
            django-version: "Django>=3.2,<4.0"
          - python-version: "3.9"
            django-version: "Django>=3.2,<4.0"
          - python-version: "3.10"
            django-version: "Django>=3.2,<4.0"

          # Django 4.0: Python 3.8, 3.9, 3.10
          - python-version: "3.8"
            django-version: "Django>=4.0,<4.1"
          - python-version: "3.9"
            django-version: "Django>=4.0,<4.1"
          - python-version: "3.10"
            django-version: "Django>=4.0,<4.1"

          # Django 4.1: Python 3.8, 3.9, 3.10, 3.11
          - python-version: "3.8"
            django-version: "Django>=4.1,<4.2"
          - python-version: "3.9"
            django-version: "Django>=4.1,<4.2"
          - python-version: "3.10"
            django-version: "Django>=4.1,<4.2"
          - python-version: "3.11"
            django-version: "Django>=4.1,<4.2"

          # Django 4.2 LTS: Python 3.8, 3.9, 3.10, 3.11, 3.12
          - python-version: "3.8"
            django-version: "Django>=4.2,<5.0"
          - python-version: "3.9"
            django-version: "Django>=4.2,<5.0"
          - python-version: "3.10"
            django-version: "Django>=4.2,<5.0"
          - python-version: "3.11"
            django-version: "Django>=4.2,<5.0"
          - python-version: "3.12"
            django-version: "Django>=4.2,<5.0"

          # Django 5.0: Python 3.10, 3.11, 3.12
          - python-version: "3.10"
            django-version: "Django>=5.0,<5.1"
          - python-version: "3.11"
            django-version: "Django>=5.0,<5.1"
          - python-version: "3.12"
            django-version: "Django>=5.0,<5.1"

          # Django 5.1: Python 3.10, 3.11, 3.12, 3.13
          - python-version: "3.10"
            django-version: "Django>=5.1,<5.2"
          - python-version: "3.11"
            django-version: "Django>=5.1,<5.2"
          - python-version: "3.12"
            django-version: "Django>=5.1,<5.2"
          - python-version: "3.13"
            django-version: "Django>=5.1,<5.2"

          # Django 5.2 LTS: Python 3.10, 3.11, 3.12, 3.13
          - python-version: "3.10"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.11"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.12"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.13"
            django-version: "Django>=5.2,<6.0"

          # Django 6.0: Python 3.12, 3.13, 3.14
          - python-version: "3.12"
            django-version: "Django>=6.0,<6.1"
          - python-version: "3.13"
            django-version: "Django>=6.0,<6.1"
          - python-version: "3.14"
            django-version: "Django>=6.0,<6.1"

    name: Python ${{ matrix.python-version }} / ${{ matrix.django-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.django-version }}"
          pip install -e .

      - name: Run tests
        run: |
          DJANGO_SETTINGS_MODULE=adv_cache_tag.tests.testproject.settings django-admin test adv_cache_tag
